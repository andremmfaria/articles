name: Publish articles to DEV.to

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'articles/**/*.md'
      - '.github/workflows/publish.yml'
      - '.github/scripts/devto_*.py'

jobs:
  publish:
    name: Publish markdown to DEV.to
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute changed article files
        id: changed
        run: >-
          python .github/scripts/devto_workflow.py changed
          --event-name "${{ github.event_name }}"
          --before "${{ github.event.before }}"
          --sha "${{ github.sha }}"

      - name: Publish changed articles on DEV.to
        if: steps.changed.outputs.publish == 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        run: >-
          python .github/scripts/devto_workflow.py publish
          --repo "${{ github.repository }}"
          --branch "${{ github.ref_name }}"

      - name: Commit article metadata updates
        if: steps.changed.outputs.publish == 'true'
        run: >-
          python .github/scripts/devto_workflow.py commit-metadata
          --branch "${{ github.ref_name }}"
